<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>e-donkun.github.io</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f7;
    --panel-bg: #ffffff;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --border: #d2d2d7;
    --accent: #0071e3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1c1e;
      --panel-bg: #2c2c2e;
      --text: #f5f5f7;
      --muted: #a1a1a6;
      --border: #48484a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
    padding: 24px 16px;
  }
  .layout {
    max-width: 720px;
    margin: 0 auto;
  }
  h1 {
    font-size: 1.4rem;
    margin: 0 0 4px;
  }
  .subtitle {
    color: var(--muted);
    font-size: 0.9rem;
    margin: 0 0 24px;
  }
  ul.pages {
    list-style: none;
    margin: 0;
    padding: 0;
    display: grid;
    gap: 12px;
  }
  ul.pages li a {
    display: block;
    background: var(--panel-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    text-decoration: none;
    color: var(--text);
  }
  ul.pages li a:hover {
    border-color: var(--accent);
  }
  ul.pages li a .title {
    font-weight: 600;
    margin-bottom: 4px;
  }
  ul.pages li a .desc {
    color: var(--muted);
    font-size: 0.85rem;
  }
</style>
</head>
<body>
<div class="layout">
  <h1>e-donkun.github.io</h1>
  <p class="subtitle">公開しているページの一覧です。</p>
  <ul class="pages">
    <li>
      <a href="dncl2/">
        <div class="title">DNCL → WebAssembly コンソール</div>
        <div class="desc">共通テスト手順記述標準言語（DNCL）をブラウザ上のWebAssemblyで実行します。外部ネットワークへは一切アクセスしません。</div>
      </a>
    </li>
  </ul>
</div>
</body>
</html>
